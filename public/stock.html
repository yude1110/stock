<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>個股分析</title>
<link rel="stylesheet" href="/base.css">
<style>
  .wrap { max-width: 1600px; }
  header { margin-bottom: 10px; }
  .q-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .q-title .sym { font-size: 26px; font-weight: 750; letter-spacing: .5px; }
  .q-title .nm { font-size: 18px; color: var(--muted); }
  .q-title .px { font-size: 32px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .q-title .chg { font-size: 18px; font-variant-numeric: tabular-nums; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag2 { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
  .star { font-size: 18px; padding: 2px 10px; }
  .star.on { color: #ffc94d; border-color: #ffc94d; }

  /* 數據列 */
  .strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; margin: 10px 0 14px; }
  .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 0; }
  .cell span { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .cell b { font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .cell small { font-size: 11px; color: var(--muted); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .panel h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .panel h3 small { color: var(--muted); font-weight: 400; font-size: 11px; }

  /* K 線圖 */
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .toolbar .grp { display: inline-flex; gap: 3px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .toolbar .grp button { border: 0; background: none; padding: 3px 9px; font-size: 12px; border-radius: 6px; color: var(--muted); }
  .toolbar .grp button.on { background: var(--accent); color: #fff; }
  .toolbar .ma button.on { background: none; color: var(--c); box-shadow: inset 0 -2px 0 var(--c); }
  .chartwrap { position: relative; }
  #mainChart { height: 460px; }
  #subChart { height: 150px; border-top: 1px solid var(--line); }
  .legend { position: absolute; left: 8px; top: 6px; z-index: 3; font-size: 12px; pointer-events: none; font-variant-numeric: tabular-nums;
    display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 80px); text-shadow: 0 1px 2px #000; }
  .legend.sub { top: 466px; }
  .legend i { font-style: normal; color: var(--muted); }

  /* 技術面總評 */
  .gauge { position: relative; height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--down), #3a4256 50%, var(--up)); margin: 10px 0 4px; }
  .gauge .needle { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.7);
    transition: left 1s var(--ease); transform: translateX(-50%); }
  .gauge-lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .verdict { font-size: 20px; font-weight: 700; }
  .sigs { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; max-height: 260px; overflow-y: auto; }
  .sigs li { padding: 4px 8px; border-radius: 6px; background: var(--panel2); border-left: 3px solid var(--muted); animation: rise .4s var(--ease) both; animation-delay: calc(var(--i) * 40ms); }
  .sigs li.bull { border-left-color: var(--up); } .sigs li.bear { border-left-color: var(--down); } .sigs li.info { border-left-color: #ffc94d; }

  .lv { width: 100%; font-size: 13px; }
  .lv td { padding: 4px 4px; }
  .lv td:first-child { color: var(--muted); }
  .lv tr.now td { color: var(--text); font-weight: 700; background: rgba(91,140,255,.12); }

  /* 下單匣 */
  .ticket .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .ticket .sides button { padding: 8px; font-weight: 700; }
  .ticket .sides button.on[data-side="buy"] { background: var(--up); border-color: var(--up); color: #fff; }
  .ticket .sides button.on[data-side="sell"] { background: var(--down); border-color: var(--down); color: #fff; }
  .ticket .row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .ticket .row label { width: 44px; color: var(--muted); font-size: 12px; flex: none; }
  .ticket .row input { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
  .ticket .est { font-size: 12px; color: var(--muted); background: var(--panel2); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; line-height: 1.7; }
  .ticket .est b { color: var(--text); font-variant-numeric: tabular-nums; }
  .ticket .submit { width: 100%; padding: 10px; font-weight: 700; font-size: 15px; color: #fff; border: 0; }
  .ticket .submit.buy { background: var(--up); } .ticket .submit.sell { background: var(--down); }
  .ticket .msg { font-size: 12px; margin-top: 6px; min-height: 18px; }
  .broker-badge { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(255,201,77,.15); color: #ffc94d; border: 1px solid rgba(255,201,77,.4); }

  /* 分頁 */
  .tabbar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 12px; position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: 6px; flex-wrap: wrap; }
  .tabbar button { border: 0; border-radius: 8px 8px 0 0; background: none; padding: 8px 16px; color: var(--muted); font-weight: 600; position: relative; }
  .tabbar button.on { color: var(--text); }
  .tabbar button.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px; background: var(--accent); animation: grow .3s var(--ease); }
  @keyframes grow { from { transform: scaleX(0); } }
  .pane { display: none; } .pane.on { display: block; animation: rise .35s var(--ease); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .kc { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
  .kc span { display: block; color: var(--muted); font-size: 11px; }
  .kc b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .kc small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pbar { height: 6px; border-radius: 99px; background: var(--panel2); margin-top: 6px; position: relative; overflow: hidden; }
  .pbar i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, #19c37d, #ffc94d, #ff4d5e); transition: width 1s var(--ease); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 960px) { .two { grid-template-columns: 1fr; } }
  .sec { margin-bottom: 16px; }
  .sec h3 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  .sec h3 small { color: var(--muted); font-weight: 400; font-size: 11px; }
  table.dt { font-size: 13px; }
  table.dt th, table.dt td { padding: 5px 7px; }
  table.dt tbody tr:hover td { background: var(--panel2); }
  .mini { height: 220px; }
  .bars svg text { fill: var(--muted); font-size: 10px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .note { color: var(--muted); font-size: 12px; }
  .pos-row td { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="btn" href="/">← 儀表板</a>
    <div class="search"><input placeholder="搜尋股票：2330、台積電、NVDA…" autocomplete="off"></div>
    <span id="state" class="badge">—</span>
    <span id="updated" class="badge">—</span>
    <span class="spacer"></span>
    <button id="colorBtn" title="切換漲跌顏色">紅漲綠跌</button>
  </header>

  <section class="panel">
    <div class="q-title">
      <span class="sym" id="qSym">—</span><span class="nm" id="qName"></span>
      <button class="star" id="starBtn" title="加入 / 移除自選股">☆</button>
      <span class="spacer"></span>
      <span class="px" id="qPx">—</span><span class="chg" id="qChg"></span>
    </div>
    <div class="tags" id="qTags" style="margin-top:6px"></div>
  </section>
  <section class="strip" id="strip"></section>

  <div class="layout">
    <div class="panel">
      <div class="toolbar">
        <div class="grp" id="tfGrp"><button data-tf="D" class="on">日K</button><button data-tf="W">週K</button><button data-tf="M">月K</button></div>
        <div class="grp ma" id="maGrp"></div>
        <div class="grp" id="ovGrp"><button data-ov="bb">布林</button><button data-ov="lv">支撐壓力</button></div>
        <span class="spacer"></span>
        <div class="grp" id="subGrp"><button data-sub="kd" class="on">KD</button><button data-sub="macd">MACD</button><button data-sub="rsi">RSI</button><button data-sub="bias">乖離</button><button data-sub="obv">OBV</button></div>
      </div>
      <div class="chartwrap">
        <div class="legend" id="legend"></div>
        <div class="legend sub" id="legend2"></div>
        <div id="mainChart"></div>
        <div id="subChart"></div>
      </div>
      <div class="note" style="margin-top:6px">滾輪縮放、拖曳平移；十字線同步顯示 OHLC 與指標數值。日K 2 年、週K 10 年、月K 全部歷史。</div>
    </div>

    <div class="side">
      <div class="panel">
        <h3>🧭 技術面總評 <small id="tfLbl">日K</small></h3>
        <div class="verdict" id="verdict">—</div>
        <div class="gauge"><div class="needle" id="needle" style="left:50%"></div></div>
        <div class="gauge-lbl"><span>空</span><span id="bbCount"></span><span>多</span></div>
        <ul class="sigs" id="sigs"></ul>
      </div>
      <div class="panel">
        <h3>📐 支撐 / 壓力 <small>樞紐點 + 波段高低點</small></h3>
        <table class="lv" id="levels"></table>
      </div>
      <div class="panel ticket" id="ticket">
        <h3>⚡ 下單 <span class="broker-badge" id="brokerBadge">模擬交易</span></h3>
        <div class="sides"><button data-side="buy" class="on">買進</button><button data-side="sell">賣出</button></div>
        <div class="row"><label>類型</label><div class="grp" id="otype" style="display:inline-flex;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px">
          <button data-ot="limit" class="on" style="border:0;padding:3px 12px;font-size:12px">限價</button><button data-ot="market" style="border:0;padding:3px 12px;font-size:12px">市價</button></div></div>
        <div class="row"><label>價格</label><input id="oPrice" type="number" step="0.01"><button id="oPx" title="帶入現價">現價</button></div>
        <div class="row"><label>數量</label><input id="oQty" type="number" min="1" value="1"><span id="qtyUnit" class="note" style="width:auto">張</span></div>
        <div class="row" id="lotRow"><label></label><label style="width:auto"><input type="checkbox" id="oOdd"> 零股（以股為單位）</label></div>
        <div class="est" id="oEst"></div>
        <button class="submit buy" id="oSubmit">買進</button>
        <div class="msg" id="oMsg"></div>
      </div>
      <div class="panel">
        <h3>💼 帳戶 <small id="accNote"></small></h3>
        <div id="accBox" class="note">載入中…</div>
      </div>
    </div>
  </div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="fund" class="on">📊 基本面</button>
    <button data-tab="chips">🧩 籌碼面</button>
    <button data-tab="news">📰 消息面</button>
    <button data-tab="ind">📈 技術指標明細</button>
    <button data-tab="account">💼 帳戶與委託</button>
  </nav>
  <section class="pane on" id="pane-fund"><div class="empty">載入中…</div></section>
  <section class="pane" id="pane-chips"><div class="empty">載入中…</div></section>
  <section class="pane" id="pane-news"><ul class="news" id="newsList"></ul></section>
  <section class="pane" id="pane-ind"></section>
  <section class="pane" id="pane-account"></section>

  <footer>資料來源：Yahoo Finance、Yahoo 奇摩股市、FinMind、Nasdaq、鉅亨網、Google 新聞。技術訊號為機械式規則判讀，僅供參考，不構成投資建議。</footer>
</div>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/common.js"></script>
<script src="/stock.js"></script>
</body>
</html>
